name: Build PyMermaid packages

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Record Python executable on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "PYTHON_EXECUTABLE=$(python -c 'import sys; print(sys.executable)')" >> $env:GITHUB_ENV
          $pythonRoot = & python -c "import sys; print(sys.base_prefix)"
          $pythonTcl = Join-Path $pythonRoot 'tcl\tcl8.6'
          $pythonTk = Join-Path $pythonRoot 'tcl\tk8.6'
          $pythonTclDll = Join-Path $pythonRoot 'DLLs\tcl86t.dll'
          $pythonTkDll = Join-Path $pythonRoot 'DLLs\tk86t.dll'
          if (-not (Test-Path (Join-Path $pythonTcl 'init.tcl'))) { throw "Python Tcl runtime was not found in $pythonTcl" }
          if (-not (Test-Path (Join-Path $pythonTk 'tk.tcl'))) { throw "Python Tk runtime was not found in $pythonTk" }
          if (-not (Test-Path $pythonTclDll)) { throw "Python Tcl DLL was not found at $pythonTclDll" }
          if (-not (Test-Path $pythonTkDll)) { throw "Python Tk DLL was not found at $pythonTkDll" }
          "PYTHON_ROOT=$pythonRoot" >> $env:GITHUB_ENV
          "PYTHON_TCL=$pythonTcl" >> $env:GITHUB_ENV
          "PYTHON_TK=$pythonTk" >> $env:GITHUB_ENV

      - name: Install Cairo native runtime on Windows
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-cairo

      - name: Configure Cairo runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $cairoDir = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          $cairo = Join-Path $cairoDir 'libcairo-2.dll'
          if (-not (Test-Path $cairo)) { throw "libcairo-2.dll was not found in $cairoDir" }
          "CAIRO_DLL_DIR=$cairoDir" >> $env:GITHUB_ENV
          $cairoDir >> $env:GITHUB_PATH
          $env:Path = "$cairoDir;$env:Path"

      - name: Install Graphviz runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install graphviz --no-progress -y
          $dot = Get-ChildItem -Path 'C:\Program Files\Graphviz', 'C:\Program Files (x86)\Graphviz' -Recurse -Filter dot.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $dot) { throw 'dot.exe was not found after installing Graphviz' }
          $graphvizRoot = $dot.Directory.Parent.FullName
          "GRAPHVIZ_BIN=$($dot.DirectoryName)" >> $env:GITHUB_ENV
          "GRAPHVIZ_ROOT=$graphvizRoot" >> $env:GITHUB_ENV
          $dot.DirectoryName >> $env:GITHUB_PATH
          $env:Path = "$($dot.DirectoryName);$env:Path"

      - name: Prepare Graphviz runtime for PyInstaller
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Graphviz ships its own Tcl/Tk DLLs. Including them beside the
          # application conflicts with the Tcl/Tk version bundled by Python,
          # causing tkinter to reject init.tcl at startup. Graphviz dot does
          # not need those DLLs, so stage only its executable and other DLLs.
          $graphvizStage = Join-Path $env:RUNNER_TEMP 'pymermaid-graphviz'
          New-Item -ItemType Directory -Force $graphvizStage | Out-Null
          Copy-Item (Join-Path $env:GRAPHVIZ_BIN 'dot.exe') $graphvizStage
          Get-ChildItem (Join-Path $env:GRAPHVIZ_BIN '*.dll') |
            Where-Object { $_.Name -notmatch '^(tcl|tk)\d' } |
            Copy-Item -Destination $graphvizStage
          # Keep Graphviz plugins beside dot.exe. This is more reliable than
          # preserving the installed lib/graphviz hierarchy after relocation
          # into PyInstaller's one-file extraction directory.
          Get-ChildItem (Join-Path $env:GRAPHVIZ_ROOT 'lib\graphviz\*.dll') |
            Where-Object { $_.Name -notmatch '^(tcl|tk)\d' } |
            Copy-Item -Destination $graphvizStage
          $env:Path = "$graphvizStage;$env:Path"
          & (Join-Path $graphvizStage 'dot.exe') -c
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Graphviz plugin registration failed' }
          $svgProbe = "digraph { a -> b }" | & (Join-Path $graphvizStage 'dot.exe') -Tsvg 2>&1
          if ($LASTEXITCODE -ne 0 -or -not ($svgProbe -match '<svg')) { throw 'Bundled Graphviz SVG probe failed' }
          "GRAPHVIZ_STAGE=$graphvizStage" >> $env:GITHUB_ENV

      - name: Prepare Cairo runtime for PyInstaller
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Keep the Tcl/Tk DLLs supplied by Python authoritative. Some MSYS2
          # installations also contain Tcl/Tk DLLs, but their version may not
          # match the Python interpreter used by PyInstaller.
          $cairoStage = Join-Path $env:RUNNER_TEMP 'pymermaid-cairo'
          New-Item -ItemType Directory -Force $cairoStage | Out-Null
          Get-ChildItem (Join-Path $env:CAIRO_DLL_DIR '*.dll') |
            Where-Object { $_.Name -notmatch '^(tcl|tk)\d' } |
            Copy-Item -Destination $cairoStage
          "CAIRO_STAGE=$cairoStage" >> $env:GITHUB_ENV

      - name: Verify Cairo runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& $env:PYTHON_EXECUTABLE -c "import cairosvg; print(''CairoSVG runtime OK'')"'

      - name: Run syntax checks
        if: runner.os != 'Windows'
        run: python -m py_compile mermaid_renderer.py pymermaid.py pymermaid_app.py

      - name: Run syntax checks on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& $env:PYTHON_EXECUTABLE -m py_compile mermaid_renderer.py pymermaid.py pymermaid_app.py'

      - name: Build application on Unix
        if: runner.os != 'Windows'
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile --windowed
          --name PyMermaid
          --collect-all cairosvg
          --collect-all cairocffi
          pymermaid_app.py

      - name: Build application on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          & $env:PYTHON_EXECUTABLE -m PyInstaller --clean --noconfirm --onefile --windowed
          --name PyMermaid
          --collect-all cairosvg
          --collect-all cairocffi
          --add-binary "$env:CAIRO_STAGE\*;."
          --add-binary "$env:PYTHON_ROOT\DLLs\tcl86t.dll;."
          --add-binary "$env:PYTHON_ROOT\DLLs\tk86t.dll;."
          --add-binary "$env:GRAPHVIZ_STAGE\*;graphviz"
          --add-data "$env:PYTHON_TCL;python_tcl"
          --add-data "$env:PYTHON_TK;python_tk"
          --add-data "$env:GRAPHVIZ_ROOT\share\graphviz;graphviz\share\graphviz"
          --runtime-hook pymermaid_tk_runtime.py
          pymermaid_app.py

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Compress-Archive -Path dist/PyMermaid.exe -DestinationPath "package/PyMermaid-Windows-x64.zip"

      - name: Package Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package
          tar -czf package/PyMermaid-Linux-x64.tar.gz -C dist PyMermaid
          mkdir -p deb/DEBIAN deb/usr/lib/pymermaid deb/usr/share/applications
          install -m 0755 dist/PyMermaid deb/usr/lib/pymermaid/PyMermaid
          cat > deb/DEBIAN/control <<'EOF'
          Package: pymermaid
          Version: 1.0.0
          Section: graphics
          Priority: optional
          Architecture: amd64
          Depends: libc6, libcairo2, libfontconfig1, libfreetype6, libx11-6, libxext6, libxfixes3, libxi6, libxrender1, libxrandr2, graphviz
          Maintainer: ThierryHFR
          Description: PyMermaid flowchart editor
           Desktop editor for rendering Mermaid flowcharts and sequence diagrams.
          EOF
          cat > deb/usr/share/applications/pymermaid.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=PyMermaid
          Comment=Mermaid diagram editor
          Exec=/usr/lib/pymermaid/PyMermaid
          Terminal=false
          Categories=Graphics;Development;
          EOF
          dpkg-deb --build --root-owner-group deb package/PyMermaid-Debian-Ubuntu-amd64.deb

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p package
          ditto -c -k --sequesterRsrc --keepParent \
            dist/PyMermaid \
            package/PyMermaid-macOS-x64.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: PyMermaid-${{ runner.os }}
          path: package/*
          if-no-files-found: error

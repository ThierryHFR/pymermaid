name: Build PyMermaid packages

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install Cairo native runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install gtk-runtime --no-progress -y
          $cairo = Get-ChildItem -Path 'C:\Program Files', 'C:\Program Files (x86)', 'C:\GTK*' -Recurse -Filter libcairo-2.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $cairo) { throw 'libcairo-2.dll was not found after installing GTK Runtime' }
          "CAIRO_DLL_DIR=$($cairo.DirectoryName)" >> $env:GITHUB_ENV
          $cairo.DirectoryName >> $env:GITHUB_PATH
          $env:Path = "$($cairo.DirectoryName);$env:Path"

      - name: Verify Cairo runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -c "import cairosvg; print('CairoSVG runtime OK')"

      - name: Run syntax checks
        run: python -m py_compile mermaid_renderer.py pymermaid.py pymermaid_app.py

      - name: Build application on Unix
        if: runner.os != 'Windows'
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile --windowed
          --name PyMermaid
          --collect-all cairosvg
          --collect-all cairocffi
          pymermaid_app.py

      - name: Build application on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile --windowed
          --name PyMermaid
          --collect-all cairosvg
          --collect-all cairocffi
          --add-binary "$env:CAIRO_DLL_DIR\*.dll;."
          pymermaid_app.py

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Compress-Archive -Path dist/PyMermaid.exe -DestinationPath "package/PyMermaid-Windows-x64.zip"

      - name: Package Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package
          tar -czf package/PyMermaid-Linux-x64.tar.gz -C dist PyMermaid

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p package
          ditto -c -k --sequesterRsrc --keepParent \
            dist/PyMermaid \
            package/PyMermaid-macOS-x64.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: PyMermaid-${{ runner.os }}
          path: package/*
          if-no-files-found: error
